[uwsgi]
module = main
callable = app
master = true

# 适合 1核 1GB 内存 VPS 小鸡的极轻量配置
# 单进程 + 2个轻量线程，内存占用压到 50MB 以内，避免爆内存导致系统 OOM
processes = 1
threads = 2

# 关键内存防护：单 worker 物理内存超过 200MB 自动优雅平滑重启，杜绝大文件泄漏爆内存
reload-on-rss = 200

# 缓冲区大小
buffer-size = 32768

# 超时设置（避免大文件流式传输被 kill）
harakiri = 3600
socket-timeout = 600
